# The benchmark stack: the app built from this checkout, a bundled Mattermost, and an nginx serving
# benchmark/fixtures to the agents as http://fixtures/. Run it through benchmark/scripts/stack.sh,
# which points compose at this directory and at bench.env; state lives under ./state and is wiped
# between runs so every run starts from nothing (the assessing-collegium skill).
name: collegium-bench
services:
  app:
    build:
      context: ../..
      dockerfile: ./app/Dockerfile
    depends_on:
      fixtures:
        condition: service_started
      mattermost:
        condition: service_healthy
    env_file: bench.env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PUBLIC_URL=http://app:${APP_PORT:?}
      - CONFIG_PATH=/app/config.json
      - DATABASE_URL=file:///data/prod.db
      - MATTERMOST_LOCAL_URL=http://mattermost:8065
      - PLUGINS_ROOT=/srv/plugins
      - RESOURCES_ROOT=/srv/resources
      - WORKSPACE_ROOT=/workspaces
    image: collegium-bench-app
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:?}:${APP_PORT:?}'
    stop_grace_period: 15s
    volumes:
      - ./config.json:/app/config.json:ro
      - ../../plugins:/srv/plugins:ro
      - ./resources:/srv/resources:ro
      - ./state/app/data:/data
      - ./state/app/home:/home
      - ./state/app/workspaces:/workspaces
  fixtures:
    image: nginx:1.27-alpine
    volumes:
      - ../fixtures:/usr/share/nginx/html:ro
  mattermost:
    build:
      context: ../../docker/mattermost
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: 'true'
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: 'false'
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
      MM_PLUGINSETTINGS_ENABLEUPLOADS: 'true'
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: app
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: 'true'
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: 'true'
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:${MATTERMOST_PORT:?}
      MM_SQLSETTINGS_DATASOURCE: postgres://collegium:${POSTGRES_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_TEAMSETTINGS_ENABLEUSERCREATION: 'true'
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 30s
      test: ['CMD', 'curl', '--fail', 'http://localhost:8065/api/v4/system/ping']
      timeout: 5s
    image: collegium-bench-mattermost
    ports:
      - '127.0.0.1:${MATTERMOST_PORT:?}:8065'
    volumes:
      - ./state/mattermost/config:/mattermost/config
      - ./state/mattermost/data:/mattermost/data
      - ./state/mattermost/logs:/mattermost/logs
  postgres:
    environment:
      PGDATA: /data
      POSTGRES_DB: mattermost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: collegium
    healthcheck:
      interval: 5s
      retries: 20
      test: ['CMD-SHELL', 'pg_isready --dbname=mattermost --username=collegium']
      timeout: 3s
    image: postgres:17-alpine
    volumes:
      - ./state/postgres/data:/data

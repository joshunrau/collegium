name: collegium
services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: collegium
    depends_on:
      mattermost:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_HOST=0.0.0.0
      # where the app binds is not where it is reached: Mattermost calls back by service name
      - APP_PUBLIC_URL=http://app:${APP_PORT:?}
      - CONFIG_PATH=/app/config.json
      - DATABASE_URL=file:///data/prod.db
      # already delivered by env_file, restated so `:?` refuses an empty credential before anything starts
      - MATTERMOST_ADMIN_EMAIL=${MATTERMOST_ADMIN_EMAIL:?}
      - MATTERMOST_ADMIN_PASSWORD=${MATTERMOST_ADMIN_PASSWORD:?}
      - MATTERMOST_ADMIN_USERNAME=${MATTERMOST_ADMIN_USERNAME:?}
      - MATTERMOST_TEAM=${MATTERMOST_TEAM:?}
      - MATTERMOST_URL=http://mattermost:8065
      - WORKSPACE_ROOT=/workspaces
    image: ghcr.io/joshunrau/collegium:latest
    # the browser and the shell tool leave grandchildren behind, and PID 1 is the only reaper
    init: true
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ${CONFIG_PATH:?}:/app/config.json:ro
      - ./state/data:/data
      - ./state/home:/home
      - ./state/workspaces:/workspaces

  mattermost:
    build:
      context: ./docker/mattermost
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Mattermost refuses to call a private address unless it is listed here — without it every
      # approval button click fails as `address forbidden`
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: app
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: 'true'
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: 'true'
      MM_SERVICESETTINGS_SITEURL: http://localhost:${MATTERMOST_PORT:?}
      MM_SQLSETTINGS_DATASOURCE: postgres://collegium:${POSTGRES_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      # provisioning creates the administrator through the signup route, which both of these gate
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: 'true'
      MM_TEAMSETTINGS_ENABLEUSERCREATION: 'true'
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 30s
      test: ['CMD', 'curl', '--fail', 'http://localhost:8065/api/v4/system/ping']
      timeout: 5s
    ports:
      - '127.0.0.1:${MATTERMOST_PORT:?}:8065'
    restart: unless-stopped
    volumes:
      - ./state/mattermost/config:/mattermost/config
      - ./state/mattermost/data:/mattermost/data
      - ./state/mattermost/logs:/mattermost/logs

  postgres:
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: mattermost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: collegium
    healthcheck:
      interval: 5s
      retries: 20
      test: ['CMD-SHELL', 'pg_isready --dbname=mattermost --username=collegium']
      timeout: 3s
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - ./state/postgres:/var/lib/postgresql/data

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Grants Portal — Northmoor University</title>
    <style>
      :root {
        --ink: #16202c;
        --muted: #5b6b7c;
        --rule: #dce3ea;
        --accent: #8a1538;
        --surface: #fff;
        --surface-alt: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e7edf3;
          --muted: #9aa9b8;
          --rule: #2a3644;
          --accent: #e8859c;
          --surface: #0f1620;
          --surface-alt: #16202c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 3rem 1.5rem 4rem;
        background: var(--surface);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.65;
      }
      #root {
        margin-inline: auto;
        max-width: 26rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        letter-spacing: -0.02em;
      }
      .lede {
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.3rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      input {
        padding: 0.55rem 0.75rem;
        width: 100%;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: var(--surface-alt);
        color: var(--ink);
        font: inherit;
      }
      button {
        padding: 0.5rem 1.1rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .error {
        margin: 0;
        color: var(--accent);
        font-size: 0.9rem;
      }
      .secret {
        margin: 1.5rem 0 0;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--surface-alt);
        font-size: 1.35rem;
        letter-spacing: 0.01em;
      }
      .secret strong {
        color: var(--accent);
        display: flex;
        flex-direction: column;
        font-size: 2rem;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portal requires JavaScript.</noscript>
    <script>
      // Credentials for the fixture: reviewer / northmoor-2026. The award page exists only after a
      // successful submit — no URL addresses it, so a fetcher has to fill the form and wait out the
      // 500ms authentication delay before the number is in the DOM.
      const USERNAME = 'reviewer';
      const PASSWORD = 'northmoor-2026';
      const AUTH_DELAY_MS = 500;
      const SECRET_NUMBER = 892;

      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children);
        return node;
      };

      const field = (id, label, type) => {
        const input = el('input', { autocomplete: 'off', id, name: id, required: true, type });
        return { input, wrapper: el('div', {}, [el('label', { htmlFor: id, textContent: label }), input]) };
      };

      const renderAward = () => {
        document.title = 'Award Reference — Grants Portal — Northmoor University';
        document
          .getElementById('root')
          .replaceChildren(
            el('h1', { textContent: 'Award Reference' }),
            el('p', { className: 'lede', textContent: 'Signed in as reviewer. Quote this reference on all reviews.' }),
            el('p', { className: 'secret' }, ['Secret Number ', el('strong', { textContent: String(SECRET_NUMBER) })])
          );
      };

      const renderLogin = (message) => {
        const username = field('username', 'Username', 'text');
        const password = field('password', 'Password', 'password');
        const submit = el('button', { textContent: 'Sign in', type: 'submit' });

        const form = el('form', { noValidate: true }, [username.wrapper, password.wrapper, submit]);
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          if (username.input.value !== USERNAME || password.input.value !== PASSWORD) {
            renderLogin('Those credentials were not recognised.');
            return;
          }
          submit.disabled = true;
          submit.textContent = 'Signing in…';
          window.setTimeout(renderAward, AUTH_DELAY_MS);
        });

        const children = [
          el('h1', { textContent: 'Grants Portal' }),
          el('p', { className: 'lede', textContent: 'Sign in to view your award reference.' }),
          form
        ];
        if (message) {
          children.push(el('p', { className: 'error', role: 'alert', textContent: message }));
        }
        document.getElementById('root').replaceChildren(...children);
      };

      renderLogin('');
    </script>
  </body>
</html>

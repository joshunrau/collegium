name: Feature request
description: Propose new functionality
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional — how you'd expect this to work, including which module(s) it touches.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

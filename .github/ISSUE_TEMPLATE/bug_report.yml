name: Bug report
description: Something is broken or behaving unexpectedly
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module(s) affected
      description: e.g. commands/, turns/, mail/ — see the module map in AGENTS.md
      placeholder: app/src/...

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Node version:
        - pnpm version:
        - OS:

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell

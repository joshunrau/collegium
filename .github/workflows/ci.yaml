name: CI
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.script.outputs.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            package.json
      - name: Determine Release Version
        uses: actions/github-script@v7
        id: script
        with:
          result-encoding: string
          script: |
            const { determineReleaseVersion } = await import('${{ github.workspace }}/.github/utils.mjs');
            return await determineReleaseVersion({ github });
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      # the app's postinstall fetches the browser from the GitHub releases API, which is rate
      # limited per runner IP until a token raises it to the repository's own allowance
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Unit Tests
        run: pnpm test
      - name: Knip
        run: pnpm knip
      # the image is built only for a release, so the swc emit path has to break here to break on a
      # pull request at all
      - name: Build
        run: |
          pnpm build
          node --input-type=module --eval "
            import assert from 'node:assert/strict';
            import { existsSync } from 'node:fs';
            assert.ok(existsSync('app/dist/main.js'), 'app/dist/main.js was not emitted');
            assert.ok(!existsSync('app/dist/testing'), 'test-only code reached dist');
            assert.ok(existsSync('packages/config/dist/config.schema.json'), 'config.schema.json was not emitted');
            assert.ok(existsSync('packages/sdk/dist/index.js'), 'the sdk bundle was not emitted');
            assert.ok(existsSync('packages/sdk/dist/index.d.ts'), 'the sdk declarations were not emitted');
          "

      # the image is assembled from the pruned workspace, and the app depends on the SDK without
      # importing it — an edge that reads as dead. Deleting it drops the SDK from the image, and
      # every mounted plugin then has nothing to resolve its one permitted import to (§3.14).
      - name: Verify the Pruned Workspace Carries the SDK
        run: |
          pnpm exec turbo prune @collegium/app --docker --out-dir "${RUNNER_TEMP}/prune"
          if [ ! -f "${RUNNER_TEMP}/prune/full/packages/sdk/package.json" ]; then
            echo "turbo prune dropped @collegium/sdk from the image" >&2
            exit 1
          fi
      # the SDK is released with the framework on one version line: the range a plugin declares names
      # the deployment it was written for (§3.14), and a second version line makes that range mean
      # nothing. Only the bump script keeps them in step, and nothing stops a manifest edited by hand.
      - name: Verify Every Publishable Package Carries the Root Version
        run: |
          node --input-type=module --eval "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            const { listPublishable } = await import('./scripts/list-publishable.js');
            const root = JSON.parse(readFileSync('package.json', 'utf-8')).version;
            for (const { name, version } of listPublishable()) {
              assert.equal(version, root, name + ' is at ' + version + ', not the root ' + root);
            }
          "
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      # the app's postinstall fetches the browser from the GitHub releases API, which is rate
      # limited per runner IP until a token raises it to the repository's own allowance
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: End-to-end Tests
        run: pnpm test:e2e
  # Nothing else runs the shipped image. This boots the whole stack against a config that declares a
  # plugin and grants it, so a healthy app proves the image carries the SDK, the mount resolves, the
  # compiled loader ran, and the grant was satisfied — boot refuses if any of that is untrue.
  smoke:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          load: true
          tags: ghcr.io/joshunrau/collegium:latest
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      # no credentials: agents boot idle and call no model, so any well-formed key satisfies the schema
      - name: Declare a Deployment That Loads a Plugin
        run: |
          cp .env.template .env
          sed -i 's/^MATTERMOST_ADMIN_USERNAME=.*/MATTERMOST_ADMIN_USERNAME=smoke-admin/' .env
          sed -i 's/^MATTERMOST_ADMIN_PASSWORD=.*/MATTERMOST_ADMIN_PASSWORD=smoke-Password-1/' .env
          cp .github/smoke.config.json config.json
      - name: Boot the Stack
        run: docker compose up --detach --wait --wait-timeout 420
      # the same deployment with nothing mounted must refuse to start, or the check above proves nothing
      - name: Refuse a Plugin That Is Not Mounted
        run: |
          # one SQLite file serves the service, and the booted app holds its lock: left running, the
          # second container dies in `prisma migrate deploy` and never reaches the plugin loader
          docker compose stop app
          empty="$(mktemp -d)"
          if PLUGINS_ROOT="${empty}" docker compose run --rm --no-TTY app > refusal.log 2>&1; then
            echo "the app booted with no plugin mounted" >&2
            exit 1
          fi
          # the log is JSON, so the message arrives escaped; the name is what must appear in it
          grep --quiet bookmark refusal.log || {
            echo "the refusal did not name the plugin:" >&2
            cat refusal.log >&2
            exit 1
          }
      - name: Report the App Log
        if: ${{ always() }}
        run: docker compose logs app
      - name: Tear Down
        if: ${{ always() }}
        run: docker compose down --volumes

  build:
    runs-on: ${{ matrix.runner }}
    needs: [configure, check, e2e, smoke]
    if: ${{ github.event_name != 'pull_request' && needs.configure.outputs.release_version != 'null' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Prepare Platform Identifier
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image by Digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/joshunrau/collegium,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export Digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    needs: [configure, build]
    timeout-minutes: 15
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Multi-Platform Manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --tag 'ghcr.io/joshunrau/collegium:latest' \
            --tag 'ghcr.io/joshunrau/collegium:${{ needs.configure.outputs.release_version }}' \
            $(printf 'ghcr.io/joshunrau/collegium@sha256:%s ' *)
  publish-npm:
    runs-on: ubuntu-latest
    needs: [configure, merge]
    if: ${{ needs.configure.outputs.release_version != 'null' }}
    permissions:
      contents: read
      # mints an OIDC token for npm trusted publishing, so no registry token is stored here
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      # the app's postinstall fetches a browser, so only the publishable closure is installed
      - name: Build Publishable Packages
        run: |
          filters=()
          while IFS=$'\t' read -r name _ _; do
            filters+=("--filter=${name}...")
          done < <(node scripts/list-publishable.js)
          pnpm install --frozen-lockfile "${filters[@]}"
          pnpm exec turbo run build "${filters[@]}"
      # the already-published check keeps a re-run of this workflow idempotent
      - name: Publish Packages
        run: |
          while IFS=$'\t' read -r name version _; do
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            echo "Publishing ${name}@${version}"
            pnpm --filter "${name}" publish --no-git-checks
          done < <(node scripts/list-publishable.js)

  release:
    runs-on: ubuntu-latest
    needs: [configure, merge, publish-npm]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.configure.outputs.release_version }}

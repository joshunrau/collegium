name: CI
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.script.outputs.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            package.json
      - name: Determine Release Version
        uses: actions/github-script@v7
        id: script
        with:
          result-encoding: string
          script: |
            const { determineReleaseVersion } = await import('${{ github.workspace }}/.github/utils.mjs');
            return await determineReleaseVersion({ github });
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Unit Tests
        run: pnpm test
      - name: Knip
        run: pnpm knip
      # the image is built only for a release, so the swc emit path has to break here to break on a
      # pull request at all
      - name: Build
        run: |
          pnpm build
          node --input-type=module --eval "
            import assert from 'node:assert/strict';
            import { existsSync } from 'node:fs';
            assert.ok(existsSync('app/dist/main.js'), 'app/dist/main.js was not emitted');
            assert.ok(!existsSync('app/dist/testing'), 'test-only code reached dist');
            assert.ok(existsSync('packages/config/dist/config.schema.json'), 'config.schema.json was not emitted');
          "
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: End-to-end Tests
        run: pnpm test:e2e
  build:
    runs-on: ${{ matrix.runner }}
    needs: [configure, check, e2e]
    if: ${{ github.event_name != 'pull_request' && needs.configure.outputs.release_version != 'null' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Prepare Platform Identifier
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image by Digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/joshunrau/collegium,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export Digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    needs: [configure, build]
    timeout-minutes: 15
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Multi-Platform Manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --tag 'ghcr.io/joshunrau/collegium:latest' \
            --tag 'ghcr.io/joshunrau/collegium:${{ needs.configure.outputs.release_version }}' \
            $(printf 'ghcr.io/joshunrau/collegium@sha256:%s ' *)
  release:
    runs-on: ubuntu-latest
    needs: [configure, merge]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.configure.outputs.release_version }}
